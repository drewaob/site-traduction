<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SMSM Traduction</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 rx=%227%22 fill=%22%231b2a6b%22/%3E%3Cpath d=%22M13 5h6v8h8v6h-8v8h-6v-8H5v-6h8z%22 fill=%22%23c9962b%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&family=Marcellus&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans+Arabic:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
:root{
  /* Layout: lapis navigation rail on the left (top bar + bottom tabs on phones); content column; liturgical-book parallel page as the home signature */
  --ground:#f1f3f8;--surface:#ffffff;--sunk:#e7eaf2;--ink:#131a33;--muted:#5a6383;--line:#d6dbe7;
  --lapis:#1b2a6b;--lapis-2:#24378a;--lapis-ink:#eef1ff;--lapis-muted:#a9b3e3;
  --gold:#b8861f;--gold-soft:#f4ead1;--rubric:#a8321b;--rubric-soft:#f8e3dd;
  --accent:#24378a;--accent-hover:#1b2a6b;--accent-ink:#ffffff;--accent-soft:#e2e7fa;
  --brass:#8f620a;--brass-soft:#f4ead1;
  --ok:#1d6f47;--ok-soft:#dff1e7;--warn:#8f5000;--warn-soft:#fbecd6;--bad:#a8321b;--bad-soft:#f8e3dd;
  --band:#1b2a6b;--band-ink:#eef1ff;--band-muted:#a9b3e3;
  --paper:#fffffe;--paper-ink:#16181d;--paper-line:#c9cfdb;--paper-muted:#5d6475;
  --font-ui:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --font-display:"Marcellus","Amiri",Georgia,serif;
  --font-latin:"Source Serif 4",Georgia,serif;
  --arfont:"Noto Naskh Arabic";
  --r:12px;--rail:236px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0d1124;--surface:#151b33;--sunk:#10152b;--ink:#e7eaf7;--muted:#9ba4c4;--line:#2a3354;
  --lapis:#0a1035;--lapis-2:#162058;--lapis-ink:#eef1ff;--lapis-muted:#8f9ad4;
  --gold:#e0b04f;--gold-soft:#3a2f17;--rubric:#ff8a72;--rubric-soft:#3f1d16;
  --accent:#8ea2ff;--accent-hover:#a8b8ff;--accent-ink:#0b1022;--accent-soft:#1f2a52;
  --brass:#e0b04f;--brass-soft:#3a2f17;
  --ok:#62d097;--ok-soft:#173527;--warn:#f1b55c;--warn-soft:#3a2a12;--bad:#ff8a72;--bad-soft:#3f1d16;
  --band:#0a1035;--band-ink:#eef1ff;--band-muted:#8f9ad4;color-scheme:dark}}
:root[data-theme="dark"]{
  --ground:#0d1124;--surface:#151b33;--sunk:#10152b;--ink:#e7eaf7;--muted:#9ba4c4;--line:#2a3354;
  --lapis:#0a1035;--lapis-2:#162058;--lapis-ink:#eef1ff;--lapis-muted:#8f9ad4;
  --gold:#e0b04f;--gold-soft:#3a2f17;--rubric:#ff8a72;--rubric-soft:#3f1d16;
  --accent:#8ea2ff;--accent-hover:#a8b8ff;--accent-ink:#0b1022;--accent-soft:#1f2a52;
  --brass:#e0b04f;--brass-soft:#3a2f17;
  --ok:#62d097;--ok-soft:#173527;--warn:#f1b55c;--warn-soft:#3a2a12;--bad:#ff8a72;--bad-soft:#3f1d16;
  --band:#0a1035;--band-ink:#eef1ff;--band-muted:#8f9ad4;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--ground);color:var(--ink);font-family:var(--font-ui);font-size:15px;line-height:1.5}
button,select,input,textarea{font:inherit;color:inherit}
img{max-width:100%}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100%}
.rail{background:var(--lapis);color:var(--lapis-ink);display:flex;flex-direction:column;gap:6px;padding:22px 14px calc(18px + env(safe-area-inset-bottom,0px));position:sticky;top:0;height:100vh;height:100dvh;align-self:start;padding-left:max(14px,env(safe-area-inset-left,0px))}
.brandmark{display:flex;align-items:center;gap:12px;padding:0 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:10px;text-decoration:none;color:inherit}
.brandmark svg{flex:none}
.brandmark b{font-family:var(--font-display);font-weight:400;font-size:24px;letter-spacing:.08em;display:block;line-height:1}
.brandmark span{font-size:12px;color:var(--lapis-muted);letter-spacing:.14em;text-transform:uppercase}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:9px;color:var(--lapis-ink);text-decoration:none;font-weight:500;opacity:.82;position:relative}
.nav a svg{width:19px;height:19px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.nav a:hover{opacity:1;background:rgba(255,255,255,.06)}
.nav a[aria-current="page"]{opacity:1;background:rgba(255,255,255,.1)}
.nav a[aria-current="page"]::before{content:"";position:absolute;inset-inline-start:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--gold)}
[dir="rtl"] .nav a[aria-current="page"]::before{border-radius:3px 0 0 3px}
.nav .sep{height:1px;background:rgba(255,255,255,.12);margin:10px 8px}
.rail-foot{margin-top:auto;display:grid;gap:10px;padding:0 8px}
.uiswitch{display:flex;border:1px solid var(--lapis-muted);border-radius:999px;overflow:hidden;width:max-content}
.uiswitch button{background:none;border:0;color:var(--lapis-ink);padding:5px 12px;cursor:pointer;font-size:13px}
.uiswitch button[aria-pressed="true"]{background:var(--lapis-ink);color:var(--lapis)}
.who{font-size:13px;color:var(--lapis-muted);display:flex;align-items:center;justify-content:space-between;gap:8px}
.who button{background:none;border:0;color:var(--lapis-ink);cursor:pointer;font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:0}
.main{min-width:0;padding-block:28px 64px;padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px))}
.main-in{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.view{display:grid;gap:18px}
.vhead{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.vhead h1{font-family:var(--font-display);font-weight:400;font-size:clamp(26px,3.2vw,34px);line-height:1.15;margin:0;letter-spacing:.01em;text-wrap:balance}
[dir="rtl"] .vhead h1,[lang="ar"] .vhead h1{font-family:"Amiri",var(--font-display);font-weight:700}
.vhead p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.rubric{font-family:var(--font-display);color:var(--rubric);letter-spacing:.12em;text-transform:uppercase;font-size:12px}
[dir="rtl"] .rubric{letter-spacing:0;text-transform:none;font-family:"Amiri",serif;font-size:15px}

/* phones: rail becomes a top bar + bottom tabs */
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  .rail{position:sticky;top:0;height:auto;z-index:15;flex-direction:row;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  .brandmark{border:0;padding:0;margin:0;flex:1}
  .brandmark b{font-size:20px}
  .nav{position:fixed;bottom:0;left:0;right:0;z-index:16;background:var(--lapis);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));border-top:1px solid rgba(255,255,255,.12)}
  .nav a{flex-direction:column;gap:3px;font-size:11px;padding:6px 4px;flex:1;justify-content:center}
  .nav a[aria-current="page"]::before{inset-inline-start:30%;inset-inline-end:30%;top:-6px;bottom:auto;width:auto;height:3px;border-radius:0 0 3px 3px}
  .nav .sep{display:none}
  .rail-foot{margin:0;padding:0;display:flex;align-items:center}
  .who span{display:none}
  .main{padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
}

/* ---------- home ---------- */
.folio{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px clamp(18px,4vw,40px);display:grid;gap:18px;position:relative;overflow:hidden}
.folio>*{position:relative;z-index:1}
.folio::after{z-index:0;content:"";position:absolute;inset-inline-end:-40px;top:-40px;width:180px;height:180px;background:radial-gradient(circle,var(--gold-soft),transparent 70%);pointer-events:none}
.parallel{display:grid;grid-template-columns:1fr 2px 1fr;gap:clamp(14px,3vw,34px);align-items:start}
.parallel .rule{background:linear-gradient(var(--gold),var(--gold)) center/2px 100% no-repeat;height:100%;min-height:90px;position:relative}
.parallel .rule::before{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;transform:translateX(-50%) rotate(45deg);background:var(--gold)}
.parallel .fr{font-family:var(--font-latin);font-size:clamp(20px,2.4vw,27px);line-height:1.45}
.parallel .ar{font-family:"Amiri",serif;font-size:clamp(25px,3vw,34px);line-height:1.6;text-align:right}
.parallel small{display:block;margin-top:8px}
.folio .cap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:baseline}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.action{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.action:hover{border-color:var(--accent);transform:translateY(-1px)}
.action .ic{grid-row:span 2;width:46px;height:46px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.action .ic svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.action h2{margin:0;font-size:18px;font-weight:600}
.action p{margin:0;color:var(--muted);font-size:14px}
.process{display:grid;grid-template-columns:repeat(4,1fr);gap:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.process li{list-style:none;padding:18px 20px;border-inline-end:1px solid var(--line);display:grid;gap:4px;align-content:start}
.process li:last-child{border-inline-end:0}
.process b{font-weight:600}
.process span{color:var(--muted);font-size:13.5px}
.process{counter-reset:st;padding:0;margin:0}
.process li::before{counter-increment:st;content:counter(st);font-family:var(--font-display);color:var(--rubric);font-size:22px;line-height:1}
.homefoot{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:860px){.actions{grid-template-columns:1fr}.process{grid-template-columns:1fr 1fr}.process li:nth-child(2){border-inline-end:0}.process li:nth-child(-n+2){border-bottom:1px solid var(--line)}}
@media (max-width:520px){.parallel{grid-template-columns:1fr}.parallel .rule{min-height:2px;height:2px;background-size:100% 2px}.parallel .rule::before{display:none}}

/* ---------- work area ---------- */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.fld{display:grid;gap:4px;min-width:0}
.fld>span{font-size:12px;color:var(--muted);letter-spacing:.02em}
select,input[type=text],input[type=password],input[type=search]{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;max-width:100%}
.langs{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}
.langs select{min-width:170px}
.swap{border:1px solid var(--line);background:var(--sunk);border-radius:8px;width:38px;height:37px;cursor:pointer;display:grid;place-items:center}
.swap:hover{border-color:var(--accent)}
[dir="rtl"] .swap svg{transform:scaleX(-1)}
.pairhint{font-size:12px;color:var(--brass);background:var(--brass-soft);border-radius:999px;padding:3px 10px;align-self:center}
.spacer{flex:1}
.panes{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:980px){.panes{grid-template-columns:1fr}.langs select{min-width:140px}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-width:0}
.card-h{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;min-height:48px}
.card-h h2{margin:0;font-family:var(--font-display);font-weight:400;color:var(--rubric);letter-spacing:.12em;text-transform:uppercase;font-size:12.5px}
[dir="rtl"] .card-h h2{letter-spacing:0;text-transform:none;font-family:"Amiri",serif;font-size:16px}
.card-f{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line);flex-wrap:wrap}
.chip{font-size:12px;border-radius:999px;padding:2px 10px;background:var(--sunk);color:var(--muted)}
.chip.brass{background:var(--brass-soft);color:var(--brass)}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
textarea{width:100%;min-height:320px;resize:vertical;border:0;background:none;padding:16px;font-size:17px;line-height:1.75;font-family:var(--font-latin),var(--arfont),serif}
textarea:focus-visible{outline:none}
.out{min-height:320px;padding:16px;font-size:17px;line-height:1.85;white-space:pre-wrap;overflow-wrap:anywhere;flex:1}
.content{font-family:var(--font-latin),var(--arfont),serif}
.content[dir="rtl"],.content :where([dir="rtl"]){font-family:var(--arfont),var(--font-latin),serif;font-size:1.08em}
.out:empty::before{content:attr(data-empty);color:var(--muted)}
.muted{color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:8px 15px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{background:var(--accent-hover);color:var(--accent-ink)}
.btn.danger:hover{border-color:var(--bad);color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:4px 10px;font-size:13px}
.note{font-size:13.5px;padding:10px 13px;border-radius:9px;background:var(--sunk);color:var(--ink);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.note.warn{background:var(--warn-soft);color:var(--warn)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
.rail-box{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.rail-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rail-h h3{margin:0;font-size:16px;font-weight:600}
.rail-h p{margin:0;font-size:13px;color:var(--muted);flex:1;min-width:200px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.issues{display:grid;gap:8px}
.issue{border:1px solid var(--line);border-radius:9px;padding:10px 12px;display:grid;gap:6px;min-width:0}
.issue-h{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.issue .ex{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.issue .ex b{font-weight:500;color:var(--muted);font-size:12px}
.issue .ex div{min-width:0;overflow-wrap:anywhere}
.issue .fix{color:var(--ok)}

/* document steps */
.steps{display:flex;gap:0;margin:0;padding:0;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto}
.steps li{flex:1;min-width:120px;display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--muted);font-weight:500;border-inline-end:1px solid var(--line);white-space:nowrap}
.steps li:last-child{border-inline-end:0}
.steps li i{font-style:normal;font-family:var(--font-display);width:26px;height:26px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-size:14px;flex:none}
.steps li.done{color:var(--ink)}.steps li.done i{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.steps li.cur{color:var(--ink);background:var(--accent-soft)}.steps li.cur i{border-color:var(--rubric);color:var(--rubric)}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:34px 16px;text-align:center;cursor:pointer;display:grid;gap:6px;background:var(--surface);justify-items:center}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.drop strong{font-size:17px}
.drop.compact{padding:14px 16px;grid-auto-flow:column;justify-content:center;gap:10px}
.drop.compact svg{width:22px;height:22px}.drop.compact .muted{display:none}
.docbar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.progress{height:6px;background:var(--sunk);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .3s}
.preview{background:var(--sunk);border-radius:var(--r);padding:18px;overflow-x:auto}
.paper{background:var(--paper);color:var(--paper-ink);max-width:900px;margin:0 auto;padding:40px 44px;border-radius:4px;box-shadow:0 2px 12px rgba(10,20,60,.12)}
@media (max-width:600px){.paper{padding:22px 16px}.preview{padding:8px}}
.doc{font-size:16px;line-height:1.75}
.doc h1{font-size:1.6em;line-height:1.3;margin:.2em 0 .6em;text-wrap:balance}
.doc h2{font-size:1.3em;margin:1.2em 0 .5em}
.doc h3,.doc h4,.doc h5,.doc h6{font-size:1.1em;margin:1em 0 .4em}
.doc p{margin:0 0 .8em}
.doc table{border-collapse:collapse;width:100%;margin:0 0 1em}
.doc th,.doc td{border:1px solid var(--paper-line);padding:6px 10px;text-align:start;vertical-align:top}
.doc th{background:#eef1f8}
.doc ul,.doc ol{margin:0 0 .8em;padding-inline-start:1.6em}
.doc img{max-width:100%;height:auto}
.doc .note{background:none;padding:0;font-style:italic;color:var(--paper-muted);display:block;font-size:inherit}
.doc .label{font-family:var(--font-ui);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--paper-muted);margin:0 0 10px;border-bottom:1px solid var(--paper-line);padding-bottom:6px}
.doc .pb{height:1px;margin:28px 0;border-top:2px dashed var(--paper-line)}
.doc .pair{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:10px 0;border-bottom:1px solid var(--paper-line)}
.doc .pair>div{min-width:0;overflow-wrap:anywhere}
.doc .pair.head{font-family:var(--font-ui);font-size:12px;color:var(--paper-muted);letter-spacing:.04em}
.doc .missing{outline:2px solid #c0392b;outline-offset:4px;background:#fdecea;border-radius:2px}
.doc .miss-label{color:#b02a20;font-family:var(--font-ui);font-size:13px;font-weight:600;margin:0 0 4px}
.exportrow{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.segs{border-collapse:collapse;width:100%;font-size:15px;color:var(--paper-ink)}
.segs th{font:600 12px var(--font-ui);color:var(--paper-muted);text-align:start;padding:6px 8px;border-bottom:2px solid var(--paper-line);background:var(--paper)}
.segs td{padding:8px;border-bottom:1px solid var(--paper-line);vertical-align:top;width:48%;overflow-wrap:anywhere}
.segs td.n{width:auto;white-space:nowrap;color:var(--paper-muted);font:12px var(--font-ui);font-variant-numeric:tabular-nums}
.segs tr.miss td{background:#fdecea}
.segtr{width:100%;min-height:2em;field-sizing:content;border:1px solid transparent;border-radius:6px;background:transparent;color:var(--paper-ink);padding:4px 6px;resize:none;font-size:15px;line-height:1.6;overflow:hidden}
.segtr:hover{border-color:var(--paper-line)}.segtr:focus{border-color:#24378a;background:#f4f6fd;outline:none}
[contenteditable="true"]:hover{box-shadow:inset 0 0 0 1px var(--line)}[contenteditable="true"]:focus{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
.doc [data-tb]{border-radius:3px}.doc [data-tb]:focus{outline:2px solid #24378a;outline-offset:3px}

/* lexicon, team */
details>summary{cursor:pointer;font-weight:500;font-size:14px;padding:4px 0}
details[open]>summary{margin-bottom:8px}
.instr{width:100%;min-height:220px;border:1px solid var(--line);border-radius:9px;background:var(--sunk);padding:10px 12px;font:14px/1.6 var(--font-ui);resize:vertical}
.lexwrap{max-height:520px;overflow:auto;border:1px solid var(--line);border-radius:9px}
.lex{border-collapse:collapse;width:100%;font-size:13.5px}
.lex th,.lex td{text-align:start;padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
.lex th{position:sticky;top:0;background:var(--sunk);font-weight:600;font-size:12px;color:var(--muted)}
.lex td.ar{font-family:var(--arfont),serif;font-size:16px;white-space:nowrap}
.lex td.nt{color:var(--muted);min-width:220px}
.lexsearch{width:min(360px,100%)}
.box{display:grid;gap:8px}
.box h4{margin:0;font-family:var(--font-display);font-weight:400;font-size:12.5px;color:var(--rubric);text-transform:uppercase;letter-spacing:.1em}
[dir="rtl"] .box h4{text-transform:none;letter-spacing:0;font-family:"Amiri",serif;font-size:16px}
.term{display:grid;grid-template-columns:minmax(90px,auto) minmax(0,1fr) auto;gap:8px 12px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 12px}
.term .ar{font-family:var(--arfont),serif;font-size:17px}
.term input{border:1px solid var(--line);border-radius:6px;padding:5px 8px;background:var(--surface);width:100%;min-width:0}
.term small{grid-column:1/-1;color:var(--muted)}
.term .acts{display:flex;gap:6px}
@media (max-width:600px){.term{grid-template-columns:1fr}}
.point{border-inline-start:3px solid var(--rubric);background:var(--rubric-soft);border-radius:6px;padding:8px 12px;display:grid;gap:4px;font-size:14px}
.point b{color:var(--rubric)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:1fr}}
.tbl{border-collapse:collapse;width:100%;font-size:14px}
.tbl th,.tbl td{text-align:start;padding:9px 10px;border-bottom:1px solid var(--line)}
.tbl th{font-size:12px;color:var(--muted);font-weight:600}
.form{display:grid;gap:12px}
.form .row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.form input[type=text],.form input[type=password]{width:100%}
.check{display:flex;gap:8px;align-items:center;font-size:14px}
.provs{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.provs li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:center;border:1px solid var(--line);border-radius:9px;padding:8px 10px}
.provs li.off{opacity:.6}
.provs li b{font-weight:600}.provs li small{grid-column:2;color:var(--muted);font-size:12.5px}
.provs .mv{display:flex;gap:4px}.provs .mv button{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:28px;height:28px;cursor:pointer;color:var(--ink)}
.secret{font-family:ui-monospace,Menlo,monospace;background:var(--sunk);padding:2px 8px;border-radius:6px;user-select:all}

/* login */
.login{position:fixed;inset:0;z-index:40;display:grid;grid-template-columns:1.1fr 1fr;background:var(--ground)}
.login .side{background:var(--lapis);color:var(--lapis-ink);padding:48px clamp(24px,5vw,64px);display:flex;flex-direction:column;justify-content:space-between;gap:24px;position:relative;overflow:hidden}
.login .side h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,4vw,48px);margin:0;letter-spacing:.06em}
.login .side .ar{font-family:"Amiri",serif;font-size:clamp(30px,3.6vw,42px);opacity:.92;text-align:right}
.login .side .verse{display:grid;gap:10px;border-inline-start:2px solid var(--gold);padding-inline-start:18px;max-width:30em}
.login .side .verse p{margin:0;font-family:var(--font-latin);font-size:19px}
.login .side .verse small{color:var(--lapis-muted)}
.login form{align-self:center;justify-self:center;width:min(380px,calc(100% - 32px));display:grid;gap:14px}
.login form h2{margin:0 0 4px;font-family:var(--font-display);font-weight:400;font-size:28px}
.login input{width:100%}
.login .err{color:var(--bad);font-size:14px;min-height:1.2em;margin:0}
@media (max-width:820px){.login{grid-template-columns:1fr;grid-template-rows:auto 1fr}.login .side{padding:28px 20px}.login .side .verse,.login .side .ar{display:none}}

.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1}
@media (max-width:860px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
body.not-admin .admin-only{display:none!important}
.foot{color:var(--muted);font-size:12px;text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>

const EX_SRC="الدرس الأول: سر المعمودية\n\nسر المعمودية هو الباب الذي ندخل منه إلى الكنيسة. فيه نولد ولادة جديدة من الماء والروح، كما قال السيد المسيح لنيقوديموس: «إن كان أحد لا يولد من الماء والروح لا يقدر أن يدخل ملكوت الله» (يو 3: 5).\n\nوبعد المعمودية مباشرة ننال سر الميرون، فيسكن فينا الروح القدس ويقوّينا في الجهاد الروحي.\n\nسؤال للمناقشة: كيف نعيش نعمة المعمودية في حياتنا اليومية؟";

function baseRules(){return `- Translate faithfully: preserve the meaning, context, register and terminology of the source. Avoid literal renderings that sound unnatural or are wrong in the target language.

- Never omit, summarise, merge or add content. Every sentence of the source appears in the translation, in the same order, with the same paragraph breaks. Repeated passages in the source stay repeated.
- Keep numbers, amounts, currencies, reference numbers, e-mails and URLs exactly. In dates translate month names and keep day and year values.
- In Arabic output write digits as ${S.digits==="eastern"?"Arabic-Indic digits (٠١٢٣٤٥٦٧٨٩)":"Western digits (0123456789)"}.
- Keep personal names consistent everywhere; when the scripts differ, transliterate them in the standard way and give the original spelling in parentheses on first mention.
- Do not add notes, comments or explanations.`}

function textPrompt(src){return `You are a senior professional translator. Translate the text between <source> tags from ${srcLabel()} into ${promptName(S.tgt)}.

${projectBlock(src)}
Rules:
${baseRules()}

${extraFormat()}

function docPrompt(html){return `You are a senior professional translator. Translate the HTML fragment between <fragment> tags from ${srcLabel()} into ${promptName(S.tgt)}.

${baseRules()}
HTML rules:

const KEEP=new Set(["H1","H2","H3","H4","H5","H6","P","UL","OL","LI","TABLE","THEAD","TBODY","TFOOT","TR","TH","TD","CAPTION","STRONG","B","EM","I","U","BR","IMG","SUP","SUB","BLOCKQUOTE","HR","PRE"]);
const DROP=new Set(["SCRIPT","STYLE","IFRAME","OBJECT","EMBED","NOSCRIPT","SVG","HEAD","META","LINK","TEMPLATE","FORM","BUTTON","INPUT","SELECT","TEXTAREA","CANVAS","VIDEO","AUDIO"]);
const BLOCKS=new Set(["H1","H2","H3","H4","H5","H6","P","UL","OL","TABLE","BLOCKQUOTE","HR","PRE","DIV"]);
function clean(node){
  const frag=document.createDocumentFragment();
  node.childNodes.forEach(ch=>{
    if(ch.nodeType===3){frag.appendChild(document.createTextNode(ch.nodeValue));return}
    if(ch.nodeType!==1)return;const tag=ch.tagName.toUpperCase();

    const el=document.createElement(tag.toLowerCase());

    if(ch.classList&&ch.classList.contains("note"))el.className="note";

  });

}
function addImg(src){const i=IMGS.length;const im={src,w:0,h:0};IMGS.push(im);const o=new Image();o.onload=()=>{im.w=o.naturalWidth;im.h=o.naturalHeight};o.src=src;return i}

  const walk=parent=>{[...parent.childNodes].forEach(n=>{
    if(n.nodeType===1&&n.tagName==="DIV"){flush();walk(n);return}
    if(n.nodeType===1&&BLOCKS.has(n.tagName)){flush();if(n.textContent.trim()||n.querySelector("img")||n.tagName==="HR")out.push(n);return}
    if(n.nodeType===3&&!n.nodeValue.trim()&&!buf)return;

function textToHtml(t,md){

      const lines=p.split("\n");if(lines.every(l=>/^\s*[-*+]\s+/.test(l)))return"<ul>"+lines.map(l=>`<li>${esc(l.replace(/^\s*[-*+]\s+/,""))}</li>`).join("")+"</ul>";
      if(lines.every(l=>/^\s*\d+[.)]\s+/.test(l)))return"<ol>"+lines.map(l=>`<li>${esc(l.replace(/^\s*\d+[.)]\s+/,""))}</li>`).join("")+"</ol>";

async function loadPdfLib(){await loadScript(LIB.pdf);await loadScript(LIB.pdfw);pdfjsLib.GlobalWorkerOptions.workerSrc=LIB.pdfw;return pdfjsLib}
async function pdfText(pdf){

async function pageBlob(pdf,n,o={}){
  const page=await pdf.getPage(n);const v1=page.getViewport({scale:1});
  const target=o.px||1700;const sc=Math.min(o.px?5:2.2,target/v1.width);const vp=page.getViewport({scale:sc});
  const c=document.createElement("canvas");c.width=Math.round(vp.width);c.height=Math.round(vp.height);const ctx=c.getContext("2d");
  ctx.fillStyle="#fff";ctx.fillRect(0,0,c.width,c.height);await page.render({canvasContext:ctx,viewport:vp}).promise;
  if(o.clean)cleanCanvas(c);
  return await new Promise(r=>c.toBlob(r,o.png?"image/png":"image/jpeg",.9));
}
/* niveaux de gris + étirement du contraste : aide l'OCR sur les photocopies */
function cleanCanvas(c){
  const ctx=c.getContext("2d");const im=ctx.getImageData(0,0,c.width,c.height);const d=im.data;const hist=new Uint32Array(256);
  for(let i=0;i<d.length;i+=4){const g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;d[i]=g;hist[g]++}
  const tot=d.length/4;let lo=0,hi=255,acc=0;while(lo<255&&(acc+=hist[lo])<tot*.01)lo++;acc=0;while(hi>0&&(acc+=hist[hi])<tot*.01)hi--;
  const k=255/Math.max(1,hi-lo);
  for(let i=0;i<d.length;i+=4){const v=Math.max(0,Math.min(255,(d[i]-lo)*k));d[i]=d[i+1]=d[i+2]=v}
  ctx.putImageData(im,0,0);
}
async function imageBlobClean(file,px){
  const bmp=await createImageBitmap(file);const sc=Math.min(3,Math.max(1,px/bmp.width));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*sc);c.height=Math.round(bmp.height*sc);
  const ctx=c.getContext("2d");ctx.imageSmoothingQuality="high";ctx.drawImage(bmp,0,0,c.width,c.height);cleanCanvas(c);
  return await new Promise(r=>c.toBlob(r,"image/png"));
}
/* langue de l'OCR : une seule langue lit beaucoup mieux qu'un mélange */
function ocrLangs(){

  if(S.src==="auto"){if(S.tgt==="fr"||S.tgt==="en")return["ara"];if(S.tgt==="ar")return["fra"]}
  return["ara","fra","eng"];

/* OCR gratuit et illimité dans le navigateur (Tesseract, arabe + français + anglais) */
async function tesseractOcr(signal){

    for(let p=1;p<=n;p++){

      const img=d.images.length?await imageBlobClean(d.images[p-1],2400):await pageBlob(d.pdf,p,{px:2480,png:true});

async function aiOcr(signal){
  const d=S.doc;
  const MAXP=200;const n=d.images.length||Math.min(d.pages,MAXP);if(d.pages>MAXP)toast(T("tooManyPages",{n:MAXP}));
  const parts=new Array(n).fill("");let next=1,done=0;
  const prompt=`You are an expert OCR transcriber for printed Arabic and French documents (church catechism material, often photocopied).
Transcribe this page image exactly, in its ORIGINAL language and script: do not translate, do not correct, do not summarise, do not add anything.
- Keep every Arabic diacritic (tashkeel) exactly as printed, and keep Arabic-Indic digits as printed (for example ٣٤:٢٤).
- Keep Bible references, punctuation, quotation marks and parentheses exactly.
- Ignore purely decorative elements (frames, borders, flourishes, clip-art). Transcribe text inside banners, titles, boxes and the page number.
- Reading order: right to left and top to bottom for Arabic; keep the order of blocks as a reader would read them.
- Output clean semantic HTML only: <h1>-<h3> for titles, <p> for each paragraph (join lines of the same paragraph), <ul>/<ol>/<li> for lists and dashed items, <table>/<tr>/<td> for tables, <p class="note">[...]</p> for stamps, handwriting or images with text.
- If a word is unreadable, write [?] instead of guessing.
No code fences, no <html> or <body>, no explanation.`;
  const worker=async()=>{
    while(next<=n){const p=next++;if(signal.aborted)throw{code:"cancelled"};
      const img=d.images.length?await imageBlobClean(d.images[p-1],1800):await pageBlob(d.pdf,p,{px:1800,clean:true});
      const r=await sample(prompt,{images:[img],signal});
      parts[p-1]=r.text.replace(/^\s*```(?:html)?\s*/i,"").replace(/```\s*$/,"");
      done++;docMsg(T("ocrPage",{a:done,n}));prog(done/n*.4);
    }
  };
  docMsg(T("ocrPage",{a:0,n}));
  await Promise.all(Array.from({length:Math.min(3,Math.max(1,ENG.vision.length*2))},worker));
  d.blocks=blockify(parts.join("\n"));d.ocr=false;autoTarget();
}

function makeChunks(blocks,only,max=4500){

async function save(filename,data){

async function doExport(kind){
  const x=exportData();if(!x){toast(T("nothing"));return}
  const suffix=x.tb.length?`_${x.src}-${x.tgt}`+(S.layout==="side"?"_bilingue":S.layout==="stack"?"_original-traduction":""):"";
  const base=(x.name||"traduction").replace(/[\\/:*?"<>|\n]+/g,"_").trim()+suffix;
  const btn={docx:"#exDocx",pdf:"#exPdf",html:"#exHtml",txt:"#exTxt"}[kind];$(btn).disabled=true;toast(T("building"));
  try{
    if(kind==="docx")await save(base+".docx",await buildDocx(x,S.layout));
    else if(kind==="html")await save(base+".html",htmlFile(x,S.layout));
    else if(kind==="pdf")await save(base+".pdf",await pdfBlob(x,S.layout));
    else{const txt=b=>b.map(h=>blockText(frag(h)).trim()).join("\n\n");
      const s=!x.tb.length?txt(x.sb):S.layout==="target"?txt(x.tb):S.layout==="stack"?txt(x.sb)+"\n\n────────\n\n"+txt(x.tb):x.sb.map((h,i)=>blockText(frag(h)).trim()+"\n"+(x.tb[i]?blockText(frag(x.tb[i])).trim():"")).join("\n\n");

  }catch(e){toast(T("eGeneric"))}
  finally{$(btn).disabled=false}
}

      if(!ENG.vision.length)throw{code:"images_unavailable"};
      const imgs=opts.images instanceof Blob?[opts.images]:[...opts.images];
      prompt=[{type:"text",text:prompt},...(await Promise.all(imgs.map(blobToDataUrl))).map(url=>({type:"image_url",image_url:{url}}))];list=ENG.vision;
    }
    for(let attempt=0;attempt<10;attempt++){
      const m=await slot(opts.signal,list);
      try{const r=await ovhOnce(prompt,opts,m);queueHint(false);return r}
      catch(e){if(e.code!=="retry")throw e}
    }
    throw{code:"upstream_error"};
  }
  call.json=async(input,opts)=>{const{text:t}=await call(input,opts);const clean=t.replace(/<think>[\s\S]*?<\/think>/g,"");try{return JSON.parse(clean)}catch(e){}
    const m=/```(?:json)?\s*([\s\S]*?)```/.exec(clean);if(m){try{return JSON.parse(m[1])}catch(e){}}
    const a=clean.search(/[\[{]/),b=Math.max(clean.lastIndexOf("}"),clean.lastIndexOf("]"));if(a>=0&&b>a){try{return JSON.parse(clean.slice(a,b+1))}catch(e){}}
    throw{code:"invalid_json",text:t}};
  return call;
}

/* ---------- réglages ---------- */
function renderSettings(){
  const st=$("#engStatus");if(!st||!ENG)return;
  const k=ENG.status==="ok"?["ok","stOk"]:ENG.status==="blocked"?["bad","stBlocked"]:["","stUnknown"];
  st.className="chip "+k[0];st.textContent=T(k[1]);
  $("#engVision").textContent=ENG.vision.length?ENG.vision.join(", "):T("noVision");
  fillSimple($("#qualSel"),[["best",T("qualBest")],["balanced",T("qualBal")],["fast",T("qualFast")]],ENG.quality);
  const used=new Set(textModels());
  $("#engModels").innerHTML=ENG.models.map(m=>`<li><code>${esc(m)}</code>${used.has(m)?` <span class="chip ok">${esc(T("qualUsed"))}</span>`:""}${ENG.dead.has(m)?` <span class="chip bad">${esc(T("stDead"))}</span>`:""}</li>`).join("");
  $("#engBase").textContent=ENG.base;
  $("#engCap").textContent=T("engCap",{n:textModels().length*2});
  $("#blockedNote").hidden=ENG.status!=="blocked";
  try{$("#relayIn").value=localStorage.getItem("smsm.relay")||""}catch(e){}
  $("#foot").textContent=T("engineFoot",{e:"OVHcloud AI Endpoints"+(ENG.last?" · "+ENG.last:"")});
}
$("#engTest").onclick=async()=>{
  const out=$("#engTestOut");out.textContent=T("testing");const t0=Date.now();
  try{const r=await sample("Translate into French, answer with the translation only: سر المعمودية",{});out.textContent=T("testOk",{s:((Date.now()-t0)/1000).toFixed(1),m:ENG.last||"",r:parseLang(r.text).body.trim().slice(0,80)})}
  catch(e){out.textContent=errMsg(e)}
  renderSettings();
};
$("#relayForm").addEventListener("submit",e=>{e.preventDefault();const v=$("#relayIn").value.trim();try{v?localStorage.setItem("smsm.relay",v):localStorage.removeItem("smsm.relay")}catch(x){}ENG.base=(v||OVH_DEFAULT).replace(/\/+$/,"");ENG.dead.clear();ENG.status="unknown";discoverModels();toast(T("savedOk"))});

/* ---------- navigation ---------- */
function renderWorkHead(){const d=S.tab==="doc";$("#workRubric").textContent=T(d?"workDocR":"workTextR");$("#workTitle").textContent=T(d?"workDocT":"workTextT");$("#workIntro").textContent=T(d?"workDocP":"workTextP")}
function renderShell(){
  $("#homeHello").textContent=T("homeHelloAnon");
  try{$("#homeDate").textContent=new Date().toLocaleDateString(ui==="ar"?"ar":"fr-FR",{weekday:"long",day:"numeric",month:"long"})}catch(e){}
  renderWorkHead();renderSettings();
}
function route(){
  const views={accueil:"vAccueil",texte:"vWork",document:"vWork",lexique:"vLexique",reglages:"vReglages"};
  let r=(location.hash||"#accueil").slice(1);if(!views[r])r="accueil";
  for(const id of new Set(Object.values(views)))$("#"+id).hidden=id!==views[r];
  document.querySelectorAll(".nav a").forEach(a=>a.setAttribute("aria-current",a.dataset.route===r?"page":"false"));
  if(r==="texte"||r==="document"){if(S.tab!==(r==="texte"?"text":"doc"))setTab(r==="texte"?"text":"doc");renderWorkHead()}
  if(r==="lexique")renderLexTable();
  window.scrollTo(0,0);
}
window.addEventListener("hashchange",route);
sample=makeEngine();imgMax=0;downloads={};
renderShell();
loadProjects().finally(route);
discoverModels();

</script>
